<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>SPEEDREAD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="library-view">
      <header class="app-header">
        <h1>SPEEDREAD</h1>
        <p class="tagline">one word at a time.</p>
      </header>

      <div
        id="drop-zone"
        role="button"
        tabindex="0"
        aria-label="Upload a document"
      >
        <span class="primary">Drop a file or tap to upload</span>
        <span class="secondary">EPUB · PDF · TXT</span>
        <input
          type="file"
          id="file-input"
          accept=".epub,.pdf,.txt,.md,application/pdf,application/epub+zip,text/plain"
          multiple
          hidden
        />
      </div>

      <p id="status" aria-live="polite"></p>

      <section id="doc-list" aria-label="Your library"></section>
    </main>

    <section id="reader-view" hidden>
      <div id="reader-header">
        <span id="reader-title"></span>
        <button id="btn-exit" type="button" aria-label="Back to library">✕</button>
      </div>

      <button id="word-tap" type="button" aria-label="Toggle play/pause">
        <div id="word-stage">
          <div id="word">
            <span id="word-left"></span><span id="word-orp"></span><span id="word-right"></span>
          </div>
        </div>
        <div id="progress">
          <div id="progress-track"><div id="progress-fill"></div></div>
          <div id="progress-labels">
            <span id="position-label">0 / 0</span>
            <span id="eta-label">0:00</span>
          </div>
        </div>
      </button>

      <div id="controls">
        <div class="control-row transport">
          <button id="btn-back" type="button" aria-label="Previous sentence">◀◀</button>
          <button id="btn-play" type="button" aria-label="Play">▶</button>
          <button id="btn-forward" type="button" aria-label="Next sentence">▶▶</button>
        </div>
        <div class="control-row speed">
          <button id="btn-slower" type="button" aria-label="Slower">−</button>
          <div id="wpm-slider-wrap">
            <input
              id="wpm-slider"
              type="range"
              min="100"
              max="1000"
              step="25"
              value="300"
              aria-label="Words per minute"
            />
            <span id="wpm-label">300 wpm</span>
          </div>
          <button id="btn-faster" type="button" aria-label="Faster">+</button>
        </div>
      </div>
    </section>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
